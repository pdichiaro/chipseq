# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/yaml-schema.json
name: "preseq_lcextrap"
description: Estimate library complexity curve for genomic sequencing libraries
keywords:
  - preseq
  - library
  - complexity
  - sequencing
  - genomics
tools:
  - "preseq":
      description: "Software for predicting library complexity and genome coverage in high-throughput sequencing"
      homepage: "http://smithlabresearch.org/software/preseq/"
      documentation: "http://smithlabresearch.org/wp-content/uploads/manual.pdf"
      tool_dev_url: "https://github.com/smithlabcode/preseq"
      doi: "10.1038/nmeth.2375"
      licence: ["GPL v3"]
      identifier: biotools:preseq

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - bam:
        type: file
        description: Sorted BAM/CRAM/SAM file
        pattern: "*.{bam,cram,sam}"

output:
  - lc_extrap:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*.lc_extrap.txt":
          type: file
          description: File containing extrapolated library complexity estimates
          pattern: "*.lc_extrap.txt"
  - log:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*.log":
          type: file
          description: Log file containing verbose output
          pattern: "*.log"
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions
          pattern: "versions.yml"

authors:
  - "@drpatelh"
  - "@joseespinosa"
  - "@pdichiaro"
maintainers:
  - "@drpatelh"
  - "@joseespinosa"
  - "@pdichiaro"
